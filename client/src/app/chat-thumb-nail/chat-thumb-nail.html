<div class="chatThumbNail">
  <h3>Conversations</h3>

  <p>Count: {{ conversations.length }}</p>

  <ng-container *ngFor="let conversation of conversations; trackBy: trackByConversation">
    <app-conversation-preview [chat]="conversation"></app-conversation-preview>
    <p>{{ conversation.title }}</p>
  </ng-container>
</div>
