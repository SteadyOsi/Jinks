<div class="convoList">
  @for (conversation of conversations(); track conversation.id) {
    <div class="thumbNailTab">
      <h3>{{ conversation.title }}</h3>
      <div class="lastMessage">
        <p>{{ conversation.lastMessage }}</p>
        <p>{{ conversation.lastMessageAt | date: 'shortTime' }}</p>
      </div>
    </div>
  }
</div>
