<div class="convoList">
  @for (conversation of conversations(); track conversation.id) {
    <!-- loops through all the conversations creating them, User clicks on a thumbnail, that selects the conversation -->
    <button type="button" class="thumbNailTab" (click)="selectConversation(conversation.id)">
      <h3>{{ conversation.title }}</h3>
      <div class="lastMessage">
        <p>{{ conversation.lastMessage }}</p>
        <p>{{ conversation.lastMessageAt | date: 'shortTime' }}</p>
      </div>
    </button>
  }
</div>
